# BAAS Pro 应用配置文件
# 此文件由程序自动维护，也可手动编辑

# 版本号：记录上次已查看的版本，用于判断是否弹出更新日志
# 请勿手动修改，否则每次启动都会弹出更新日志
version: "v6.0.0.1"

# 账号配置排序：决定侧边栏中账号的显示顺序
# 列表中未出现的账号会按字母顺序追加到末尾
# 示例：
#   config_order:
#     - 账号A
#     - 账号B
config_order: []

# 自动启动：启动脚本时自动运行的账号配置列表
# 示例：
#   auto_start:
#     - 账号A
auto_start: []

# 日志显示：true = 显示实时日志，false = 关闭日志轮询（节省性能）
log_show: true

# 界面主题：true = 暗色主题，false = 亮色主题
dark_theme: false

# 窗口位置和大小（由程序自动维护，请勿手动修改）
geometry: {x: 3296, y: -715, w: 960, h: 600}

# 关闭窗口行为：null = 每次询问，tray = 隐藏到托盘，quit = 直接退出
close_action: "quit"
